openapi: 3.1.0
info:
  title: StreamForge API
  version: 0.2.0
  description: StreamForge foundation and authentication APIs.
servers:
  - url: http://localhost:8080
tags:
  - name: System
  - name: Authentication
  - name: Users
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      operationId: health
      responses:
        '200':
          description: The API process is alive.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /ready:
    get:
      tags: [System]
      summary: Readiness probe
      operationId: readiness
      responses:
        '200':
          description: Required dependencies are available.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: User registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistrationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Create an authenticated session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a refresh token and issue a new session
      description: Each refresh token can be used once. Reuse revokes the entire token family.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenRequest'}
      responses:
        '200':
          description: Token rotation succeeded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh-token family
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenRequest'}
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '204':
          description: The session is revoked or was already absent.
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user
      operationId: getMe
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Authenticated user profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivateUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      operationId: updateMe
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfileRequest'}
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivateUser'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/users/{username}:
    get:
      tags: [Users]
      summary: Get a public user profile
      operationId: getUserByUsername
      parameters:
        - name: username
          in: path
          required: true
          schema: {type: string, minLength: 3, maxLength: 32}
      responses:
        '200':
          description: Public user profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicUser'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: The resource was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: A unique field is already registered.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ValidationFailed:
      description: Input validation failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: The per-client request limit was exceeded.
      headers:
        Retry-After:
          schema: {type: integer}
          description: Seconds until the current rate-limit window resets.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          pattern: '^[a-z0-9][a-z0-9_]{2,31}$'
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, minLength: 12, maxLength: 128}
        display_name: {type: string, maxLength: 80}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: {type: string}
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, minLength: 1, maxLength: 80}
        bio: {type: string, maxLength: 500}
      minProperties: 1
    PublicUser:
      type: object
      required: [id, username, display_name, bio, created_at]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        bio: {type: string}
        created_at: {type: string, format: date-time}
    PrivateUser:
      allOf:
        - {$ref: '#/components/schemas/PublicUser'}
        - type: object
          required: [email, role, updated_at]
          properties:
            email: {type: string, format: email}
            role: {type: string, enum: [USER, ADMIN]}
            updated_at: {type: string, format: date-time}
    RegistrationResponse:
      type: object
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/PrivateUser'}
    SessionResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, description: Access-token lifetime in seconds.}
        user: {$ref: '#/components/schemas/PrivateUser'}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
    Readiness:
      type: object
      required: [status, dependencies]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        dependencies:
          type: object
          additionalProperties: {type: string}
